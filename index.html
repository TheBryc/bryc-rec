<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRYC — Personalized Recommendations</title>
    <link rel="icon" type="image/png" href="assets/bryc-logo-white.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <style>
      :root {
        --font-body: "Open Sans", system-ui, sans-serif;
        --font-head: "Proxima Nova", "Montserrat", system-ui, sans-serif;
      }
      body { font-family: var(--font-body); }
      h1, h2, h3, h4, .font-head, .tabular-nums { font-family: var(--font-head); }
      #boot { min-height: 100vh; display: flex; align-items: center; justify-content: center;
              background: #f2f3f4; color: #676868; font-size: 15px; }
    </style>
</head>
<body>
    <div id="root"><div id="boot">Loading your recommendations…</div></div>
    <script src="js/corrections.js"></script>
    <script>
    /* ============ Transit+JSON decoder (rolling-cache; port of bryc-scraper) ============ */
    (function(){
      const ESC='~', SUB='^', MAPKEY='^ ';
      function Cache(){ this.codes={}; this.count=0; }
      Cache.prototype.codeFor=function(i){const hi=Math.floor(i/44),lo=i%44;
        return hi===0?SUB+String.fromCharCode(lo+48):SUB+String.fromCharCode(hi+48)+String.fromCharCode(lo+48);};
      Cache.prototype.read=function(s,asKey){
        if(s.length>0&&s[0]===SUB&&s!==MAPKEY) return this.codes[s];
        if(s.length>=4&&(asKey||(s[0]===ESC&&':$#'.includes(s[1])))){
          if(this.count>=94*94){this.codes={};this.count=0;}
          this.codes[this.codeFor(this.count)]=s; this.count++;
        }
        return s;};
      function scalar(s){
        if(!s||s[0]!==ESC) return s;
        if(s.length===1) return s;
        const c=s[1], rest=s.slice(2);
        if(c===ESC||c===SUB||c==='`') return s.slice(1);
        if(c==='#') return {__tag:rest};
        if(c===':'||c==='$'||c==='u'||c==='r'||c==='b'||c==='c') return rest;
        if(c==='m'||c==='i'||c==='n'){const n=parseInt(rest,10);return isNaN(n)?rest:n;}
        if(c==='d'||c==='f'){const n=parseFloat(rest);return isNaN(n)?rest:n;}
        if(c==='t') return rest;
        if(c==='?') return rest==='t';
        return rest;}
      function dec(node,cache,asKey){
        if(Array.isArray(node)){
          if(!node.length) return [];
          if(node[0]===MAPKEY){
            const o={};
            for(let i=1;i+1<node.length;i+=2){o[dec(node[i],cache,true)]=dec(node[i+1],cache,false);}
            return o;}
          const f=dec(node[0],cache,false);
          if(f&&typeof f==='object'&&!Array.isArray(f)&&f.__tag!==undefined){
            const inner=node.length>1?dec(node[1],cache,false):null;
            if(f.__tag==="'"||f.__tag==='set'||f.__tag==='list') return inner;
            const o={}; o[f.__tag]=inner; return o;}
          return [f].concat(node.slice(1).map(x=>dec(x,cache,false)));}
        if(typeof node==='string') return scalar(cache.read(node,asKey));
        if(node&&typeof node==='object'){
          const o={}; for(const k in node) o[k]=dec(node[k],cache,false); return o;}
        return node;}
      window.__transitDecode=raw=>dec(JSON.parse(raw),new Cache(),false);
    })();

    /* ============ boot: short-link -> token -> query -> window payload -> app ============ */
    (async function(){
      const API='https://api.bryc.obney.cloud';
      const qs=new URLSearchParams(location.search);
      let token=qs.get('token');
      try{
        if(!token){
          const code=qs.get('s');
          if(code){
            const links=await (await fetch('links.json',{cache:'no-store'})).json();
            token=links[code];
          }
        }
        if(!token) throw new Error('This link is missing its code — ask your advisor to resend it.');
        const inner=['^ ','~:query/name','~:student/recommendations',
                     '~:query/timestamp','~m'+Date.now(),
                     '~:query/id',crypto.randomUUID(),'~:token',token];
        const r=await fetch(API+'/query',{method:'POST',
          headers:{'Content-Type':'application/transit+json'},
          body:JSON.stringify(['^ ','~:query',inner])});
        if(!r.ok) throw new Error('The recommendation could not be loaded ('+r.status+') — the link may have expired.');
        const data=window.__transitDecode(await r.text());
        if(!data||!data.resolved) throw new Error('The recommendation could not be loaded — ask your advisor for a fresh link.');
        try{
          const cr=await fetch('corrections.json?v='+Date.now());
          if(cr.ok && window.__brycApplyCorrections) window.__brycApplyCorrections(data, await cr.json());
        }catch(e){ /* corrections are best-effort: never block the page on them */ }
        window.__BRYC_REC_DATA__=data;
      }catch(e){
        window.__BRYC_REC_ERROR__=String(e.message||e);
      }
      const s=document.createElement('script');
      s.src='js/main.js';
      document.body.appendChild(s);
    })();
    </script>
</body>
</html>
